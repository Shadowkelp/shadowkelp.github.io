<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Journal Grid Cutter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0ea;
    --bg-warm: #efe8df;
    --surface: #ffffff;
    --text: #2c2420;
    --text-muted: #8a7e74;
    --accent: #c4704b;
    --accent-hover: #a85a38;
    --accent-light: #f0ddd4;
    --border: #d9cfc4;
    --border-light: #e8e0d6;
    --shadow-sm: 0 1px 3px rgba(44,36,32,0.06);
    --shadow-lg: 0 8px 30px rgba(44,36,32,0.12);
    --grid-line: #c8bfb4;
    --cell-hover: #f5efe8;
    --danger: #c0392b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Header ── */
  .app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border-light);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-sm);
  }

  .header-inner {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .app-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
    line-height: 1.1;
  }

  .app-title span {
    display: block;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .header-actions { display: flex; gap: 8px; align-items: center; }

  /* ── Buttons ── */
  .btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    border-radius: 8px;
    padding: 10px 16px;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { transform: scale(0.97); }

  .btn-secondary {
    background: var(--bg-warm);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--border-light); }

  .btn-icon {
    width: 38px; height: 38px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    background: var(--bg-warm);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-icon:hover { background: var(--border-light); }
  .btn-icon svg { width: 18px; height: 18px; color: var(--text); }

  /* ── Settings Panel ── */
  .settings-panel {
    background: var(--surface);
    border-bottom: 1px solid var(--border-light);
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, padding 0.3s ease;
  }
  .settings-panel.open { max-height: 400px; padding: 16px 20px; }

  .settings-inner { max-width: 800px; margin: 0 auto; }

  .settings-row {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;
  }

  .field { flex: 1; min-width: 90px; }

  .field label {
    display: block; font-size: 11px; font-weight: 600;
    color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 5px;
  }

  .field input, .field select {
    width: 100%; padding: 9px 10px;
    font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); color: var(--text);
    transition: border-color 0.15s ease;
    -webkit-appearance: none;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }

  .grid-info {
    margin-top: 12px; font-size: 12px;
    color: var(--text-muted); font-weight: 500;
  }
  .grid-info strong { color: var(--text); }

  /* ── Canvas ── */
  .canvas-wrapper {
    padding: 20px; display: flex; justify-content: center;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }

  .paper {
    background: #fff; box-shadow: var(--shadow-lg);
    border-radius: 4px; position: relative;
    overflow: hidden; flex-shrink: 0;
  }

  .grid-container {
    display: grid; position: relative; gap: var(--grid-gap);
  }

  .grid-cell {
    border: 0.5px dashed var(--grid-line);
    position: relative; cursor: pointer;
    transition: background 0.12s ease;
    overflow: hidden; display: flex;
    align-items: center; justify-content: center;
  }

  .grid-cell:hover { background: var(--cell-hover); }
  .grid-cell.has-image:hover { background: transparent; }

  .grid-cell .placeholder-icon {
    opacity: 0; transition: opacity 0.15s ease; color: var(--border);
  }
  .grid-cell:hover .placeholder-icon { opacity: 1; }
  .grid-cell.has-image .placeholder-icon { display: none; }

  .grid-cell .edit-badge {
    position: absolute; top: 1px; right: 1px;
    width: 14px; height: 14px; border-radius: 3px;
    background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .grid-cell .edit-badge svg { width: 8px; height: 8px; color: #fff; }
  .grid-cell.has-image .edit-badge { display: flex; }

  .grid-cell img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }

  /* ── Cell Editor Modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(30,25,20,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 500;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }

  .modal {
    background: var(--surface);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    width: 100%; max-width: 340px;
    overflow: hidden;
    transform: scale(0.93) translateY(10px);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .modal-overlay.open .modal { transform: scale(1) translateY(0); }

  .modal-header {
    padding: 16px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-title { font-size: 15px; font-weight: 700; color: var(--text); }
  .modal-cell-num { font-size: 12px; font-weight: 500; color: var(--text-muted); }

  .modal-preview {
    padding: 0 20px;
    display: flex; justify-content: center; align-items: center;
  }

  .modal-preview-frame {
    position: relative;
    background: repeating-conic-gradient(#e8e0d6 0% 25%, #f5f0ea 0% 50%) 50% / 16px 16px;
    border: 2px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }

  .modal-preview-frame img {
    width: 100%; height: 100%; display: block;
  }

  .modal-fit-label {
    text-align: center; padding: 10px 0 0;
    font-size: 11px; font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  .modal-actions {
    padding: 16px 20px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }

  .modal-action-row { display: flex; gap: 8px; }

  .modal-btn {
    flex: 1;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
    border: none; cursor: pointer; border-radius: 10px;
    padding: 12px 14px;
    transition: all 0.15s ease;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .modal-btn:active { transform: scale(0.97); }
  .modal-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  .modal-btn-fit {
    background: var(--bg-warm); color: var(--text);
    border: 1px solid var(--border);
  }
  .modal-btn-fit:hover { background: var(--border-light); }

  .modal-btn-replace {
    background: var(--bg-warm); color: var(--text);
    border: 1px solid var(--border);
  }
  .modal-btn-replace:hover { background: var(--border-light); }

  .modal-btn-remove {
    background: #fdf0ee; color: var(--danger);
    border: 1px solid #e8c4bf;
  }
  .modal-btn-remove:hover { background: #fbe3df; }

  .modal-confirm-row {
    display: flex; gap: 8px; padding: 4px 20px 20px;
  }

  .modal-btn-cancel {
    flex: 1;
    font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
    border: 1px solid var(--border); cursor: pointer;
    border-radius: 10px; padding: 13px 14px;
    background: var(--surface); color: var(--text-muted);
    transition: all 0.15s ease;
  }
  .modal-btn-cancel:hover { background: var(--bg); }
  .modal-btn-cancel:active { transform: scale(0.97); }

  .modal-btn-accept {
    flex: 1.5;
    font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
    border: none; cursor: pointer; border-radius: 10px;
    padding: 13px 14px;
    background: var(--accent); color: #fff;
    transition: all 0.15s ease;
  }
  .modal-btn-accept:hover { background: var(--accent-hover); }
  .modal-btn-accept:active { transform: scale(0.97); }

  /* ── Bottom bar ── */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border-light);
    padding: 12px 20px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 100;
    box-shadow: 0 -2px 12px rgba(44,36,32,0.06);
  }

  .bottom-inner {
    max-width: 800px; margin: 0 auto;
    display: flex; justify-content: space-between;
    align-items: center; gap: 10px;
  }

  .cell-count { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .cell-count strong { color: var(--accent); }

  #fileInput { display: none; }

  .toast {
    position: fixed; bottom: 80px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text); color: #fff;
    padding: 10px 20px; border-radius: 8px;
    font-size: 13px; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: all 0.25s ease;
    z-index: 200; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Print ── */
  @media print {
    @page { size: letter; margin: 0; }
    html, body {
      width: 8.5in; height: 11in;
      overflow: hidden !important;
      background: #fff !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .app-header, .settings-panel, .bottom-bar, .toast,
    .modal-overlay, .placeholder-icon, .edit-badge {
      display: none !important;
    }
    .main-content { padding: 0 !important; }
    .canvas-wrapper {
      padding: 0 !important; margin: 0 !important;
      overflow: hidden !important; display: block !important;
    }
    .paper {
      box-shadow: none !important; border-radius: 0 !important;
      width: 8.5in !important; height: 11in !important;
      max-height: 11in !important; margin: 0 !important;
      overflow: hidden !important;
      page-break-after: avoid !important;
      break-after: avoid !important;
    }
    .grid-cell {
      border: 0.5px dashed #ccc !important;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .grid-cell img {
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
  }

  @media (max-width: 500px) {
    .app-header { padding: 12px 16px; }
    .app-title { font-size: 17px; }
    .canvas-wrapper { padding: 16px 10px; padding-bottom: 80px; }
    .settings-panel.open { padding: 12px 16px; }
    .btn { padding: 9px 12px; font-size: 12px; }
    .modal { max-width: calc(100vw - 48px); }
  }

  .main-content { padding-bottom: 70px; }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <div class="app-title">
      Grid Cutter
      <span>Journal Sticker Printer</span>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="settingsToggle" title="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
      <button class="btn btn-secondary" id="clearAllBtn">Clear All</button>
    </div>
  </div>
</header>

<div class="settings-panel" id="settingsPanel">
  <div class="settings-inner">
    <div class="settings-row">
      <div class="field">
        <label>Width</label>
        <input type="number" id="cellWidth" value="0.8" step="0.05" min="0.1">
      </div>
      <div class="field">
        <label>Height</label>
        <input type="number" id="cellHeight" value="0.9" step="0.05" min="0.1">
      </div>
      <div class="field">
        <label>Unit</label>
        <select id="unitSelect">
          <option value="in" selected>Inches</option>
          <option value="cm">Centimeters</option>
          <option value="px">Pixels</option>
        </select>
      </div>
      <div class="field">
        <label>Margin</label>
        <input type="number" id="paperMargin" value="0.25" step="0.05" min="0">
      </div>
    </div>
    <div class="grid-info" id="gridInfo"></div>
  </div>
</div>

<div class="main-content">
  <div class="canvas-wrapper" id="canvasWrapper">
    <div class="paper" id="paper">
      <div class="grid-container" id="gridContainer"></div>
    </div>
  </div>
</div>

<div class="bottom-bar">
  <div class="bottom-inner">
    <div class="cell-count" id="cellCount">0 images placed</div>
    <button class="btn btn-primary" id="printBtn">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Print
    </button>
  </div>
</div>

<!-- Cell Editor Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title">Edit Cell</div>
      <div class="modal-cell-num" id="modalCellNum"></div>
    </div>
    <div class="modal-preview">
      <div class="modal-preview-frame" id="modalPreviewFrame">
        <img id="modalPreviewImg" src="" alt="Preview">
      </div>
    </div>
    <div class="modal-fit-label" id="modalFitLabel"></div>
    <div class="modal-actions">
      <div class="modal-action-row">
        <button class="modal-btn modal-btn-fit" id="modalFitBtn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
          <span id="modalFitText">Switch to Fit</span>
        </button>
        <button class="modal-btn modal-btn-replace" id="modalReplaceBtn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
          Replace
        </button>
      </div>
      <button class="modal-btn modal-btn-remove" id="modalRemoveBtn" style="width:100%">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        Remove Image
      </button>
    </div>
    <div class="modal-confirm-row">
      <button class="modal-btn-cancel" id="modalCancelBtn">Cancel</button>
      <button class="modal-btn-accept" id="modalAcceptBtn">Accept</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*">
<div class="toast" id="toast"></div>

<script>
(function() {
  const LETTER_W_IN = 8.5, LETTER_H_IN = 11, DPI = 96, GAP_IN = 0.025;

  let cellImages = {};
  let activeCellIndex = null;

  // Modal editing state
  let editingIndex = null;
  let editingFit = null;
  let editingDataUrl = null;
  let originalFit = null;
  let originalDataUrl = null;
  let pendingReplace = false;

  const $ = id => document.getElementById(id);
  const paper = $('paper');
  const gridContainer = $('gridContainer');
  const cellWidthInput = $('cellWidth');
  const cellHeightInput = $('cellHeight');
  const unitSelect = $('unitSelect');
  const marginInput = $('paperMargin');
  const gridInfo = $('gridInfo');
  const fileInput = $('fileInput');
  const canvasWrapper = $('canvasWrapper');
  const cellCountEl = $('cellCount');
  const toastEl = $('toast');

  const modalOverlay = $('modalOverlay');
  const modalPreviewFrame = $('modalPreviewFrame');
  const modalPreviewImg = $('modalPreviewImg');
  const modalFitLabel = $('modalFitLabel');
  const modalFitBtn = $('modalFitBtn');
  const modalFitText = $('modalFitText');
  const modalReplaceBtn = $('modalReplaceBtn');
  const modalRemoveBtn = $('modalRemoveBtn');
  const modalCancelBtn = $('modalCancelBtn');
  const modalAcceptBtn = $('modalAcceptBtn');
  const modalCellNum = $('modalCellNum');

  function toInches(v, u) { return u === 'cm' ? v / 2.54 : u === 'px' ? v / DPI : v; }
  function fromInches(v, u) { return u === 'cm' ? v * 2.54 : u === 'px' ? v * DPI : v; }

  $('settingsToggle').addEventListener('click', () => $('settingsPanel').classList.toggle('open'));

  let toastTimeout;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  function getGridParams() {
    const unit = unitSelect.value;
    const cellWIn = toInches(parseFloat(cellWidthInput.value) || 0.8, unit);
    const cellHIn = toInches(parseFloat(cellHeightInput.value) || 0.9, unit);
    const marginIn = toInches(parseFloat(marginInput.value) || 0.25, unit);
    const usableW = LETTER_W_IN - marginIn * 2;
    const usableH = LETTER_H_IN - marginIn * 2;
    const cols = Math.max(1, Math.floor((usableW + GAP_IN) / (cellWIn + GAP_IN)));
    const rows = Math.max(1, Math.floor((usableH + GAP_IN) / (cellHIn + GAP_IN)));
    return { cellWIn, cellHIn, marginIn, cols, rows };
  }

  function buildGrid() {
    const { cellWIn, cellHIn, marginIn, cols, rows } = getGridParams();
    const unit = unitSelect.value;
    const total = cols * rows;

    const wrapperW = canvasWrapper.clientWidth - 20;
    const scale = Math.min(1, wrapperW / (LETTER_W_IN * DPI));

    paper.style.width = (LETTER_W_IN * DPI * scale) + 'px';
    paper.style.height = (LETTER_H_IN * DPI * scale) + 'px';

    gridContainer.style.setProperty('--grid-gap', (GAP_IN * DPI * scale) + 'px');
    gridContainer.style.gridTemplateColumns = `repeat(${cols}, ${cellWIn * DPI * scale}px)`;
    gridContainer.style.gridTemplateRows = `repeat(${rows}, ${cellHIn * DPI * scale}px)`;
    gridContainer.style.padding = (marginIn * DPI * scale) + 'px';
    gridContainer.innerHTML = '';

    const kept = {};
    for (let i = 0; i < total; i++) { if (cellImages[i]) kept[i] = cellImages[i]; }
    cellImages = kept;

    for (let i = 0; i < total; i++) {
      const cell = document.createElement('div');
      cell.className = 'grid-cell';

      const ph = document.createElement('div');
      ph.className = 'placeholder-icon';
      ph.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>';
      cell.appendChild(ph);

      const badge = document.createElement('div');
      badge.className = 'edit-badge';
      badge.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
      cell.appendChild(badge);

      if (cellImages[i]) {
        const img = document.createElement('img');
        img.src = cellImages[i].dataUrl;
        img.style.objectFit = cellImages[i].fit || 'cover';
        img.draggable = false;
        cell.appendChild(img);
        cell.classList.add('has-image');
      }

      cell.addEventListener('click', () => {
        if (cellImages[i]) {
          openModal(i);
        } else {
          activeCellIndex = i;
          pendingReplace = false;
          fileInput.click();
        }
      });

      gridContainer.appendChild(cell);
    }

    const dW = fromInches(cellWIn, unit).toFixed(unit === 'px' ? 0 : 2);
    const dH = fromInches(cellHIn, unit).toFixed(unit === 'px' ? 0 : 2);
    const uL = unit === 'in' ? '"' : unit === 'cm' ? 'cm' : 'px';
    gridInfo.innerHTML = `<strong>${cols} × ${rows}</strong> grid · ${dW}${uL} × ${dH}${uL} per cell · ${total} cells total`;
    updateCount();
  }

  function updateCount() {
    const c = Object.keys(cellImages).length;
    cellCountEl.innerHTML = `<strong>${c}</strong> image${c !== 1 ? 's' : ''} placed`;
  }

  // ── Modal ──
  function openModal(index) {
    editingIndex = index;
    const data = cellImages[index];
    if (!data) return;

    editingFit = data.fit || 'cover';
    editingDataUrl = data.dataUrl;
    originalFit = editingFit;
    originalDataUrl = editingDataUrl;

    const { cellWIn, cellHIn, cols } = getGridParams();
    const row = Math.floor(index / cols) + 1;
    const col = (index % cols) + 1;
    modalCellNum.textContent = `Row ${row}, Col ${col}`;

    // Size preview to cell aspect ratio
    const aspect = cellWIn / cellHIn;
    const maxW = 260, maxH = 240;
    let fw, fh;
    if (aspect >= 1) {
      fw = maxW; fh = maxW / aspect;
      if (fh > maxH) { fh = maxH; fw = maxH * aspect; }
    } else {
      fh = maxH; fw = maxH * aspect;
      if (fw > maxW) { fw = maxW; fh = maxW / aspect; }
    }
    modalPreviewFrame.style.width = fw + 'px';
    modalPreviewFrame.style.height = fh + 'px';

    refreshModalPreview();
    modalOverlay.classList.add('open');
  }

  function refreshModalPreview() {
    modalPreviewImg.src = editingDataUrl;
    modalPreviewImg.style.objectFit = editingFit;
    const isCover = editingFit === 'cover';
    modalFitLabel.textContent = isCover ? 'Fill — image cropped to fill cell' : 'Fit — full image visible';
    modalFitText.textContent = isCover ? 'Switch to Fit' : 'Switch to Fill';
  }

  function closeModal() {
    modalOverlay.classList.remove('open');
    editingIndex = null;
  }

  modalFitBtn.addEventListener('click', () => {
    editingFit = editingFit === 'cover' ? 'contain' : 'cover';
    refreshModalPreview();
  });

  modalReplaceBtn.addEventListener('click', () => {
    pendingReplace = true;
    activeCellIndex = editingIndex;
    fileInput.click();
  });

  modalRemoveBtn.addEventListener('click', () => {
    if (editingIndex !== null) {
      delete cellImages[editingIndex];
      closeModal();
      buildGrid();
      showToast('Image removed');
    }
  });

  modalCancelBtn.addEventListener('click', () => {
    // Revert to originals
    if (editingIndex !== null && cellImages[editingIndex]) {
      cellImages[editingIndex].fit = originalFit;
      cellImages[editingIndex].dataUrl = originalDataUrl;
    }
    closeModal();
  });

  modalAcceptBtn.addEventListener('click', () => {
    if (editingIndex !== null && cellImages[editingIndex]) {
      cellImages[editingIndex].fit = editingFit;
      cellImages[editingIndex].dataUrl = editingDataUrl;
      buildGrid();
      showToast('Changes saved');
    }
    closeModal();
  });

  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) modalCancelBtn.click();
  });

  // ── File input ──
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file || activeCellIndex === null) return;

    const reader = new FileReader();
    reader.onload = (ev) => {
      const url = ev.target.result;
      if (pendingReplace && editingIndex !== null) {
        editingDataUrl = url;
        cellImages[activeCellIndex] = { dataUrl: url, fit: editingFit };
        refreshModalPreview();
        pendingReplace = false;
      } else {
        cellImages[activeCellIndex] = { dataUrl: url, fit: 'cover' };
        buildGrid();
        showToast('Image added');
      }
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  // ── Clear all ──
  $('clearAllBtn').addEventListener('click', () => {
    if (!Object.keys(cellImages).length) return;
    if (confirm('Remove all images from the grid?')) {
      cellImages = {};
      buildGrid();
      showToast('All images cleared');
    }
  });

  // ── Print ──
  $('printBtn').addEventListener('click', () => {
    const { cellWIn, cellHIn, marginIn, cols } = getGridParams();
    paper.style.width = LETTER_W_IN + 'in';
    paper.style.height = LETTER_H_IN + 'in';
    paper.style.maxHeight = LETTER_H_IN + 'in';
    paper.style.overflow = 'hidden';
    gridContainer.style.setProperty('--grid-gap', GAP_IN + 'in');
    gridContainer.style.gridTemplateColumns = `repeat(${cols}, ${cellWIn}in)`;
    gridContainer.style.gridTemplateRows = `repeat(${getGridParams().rows}, ${cellHIn}in)`;
    gridContainer.style.padding = marginIn + 'in';
    window.print();
    setTimeout(buildGrid, 300);
  });

  // ── Settings listeners ──
  let rebuildTimer;
  const scheduleRebuild = () => { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(buildGrid, 200); };
  cellWidthInput.addEventListener('input', scheduleRebuild);
  cellHeightInput.addEventListener('input', scheduleRebuild);
  marginInput.addEventListener('input', scheduleRebuild);

  unitSelect.addEventListener('change', () => {
    const old = unitSelect.dataset.prevUnit || 'in';
    const nu = unitSelect.value;
    const wIn = toInches(parseFloat(cellWidthInput.value) || 0.8, old);
    const hIn = toInches(parseFloat(cellHeightInput.value) || 0.9, old);
    const mIn = toInches(parseFloat(marginInput.value) || 0.25, old);
    const dec = nu === 'px' ? 0 : 2;
    cellWidthInput.value = fromInches(wIn, nu).toFixed(dec);
    cellHeightInput.value = fromInches(hIn, nu).toFixed(dec);
    marginInput.value = fromInches(mIn, nu).toFixed(dec);
    cellWidthInput.step = cellHeightInput.step = marginInput.step = nu === 'px' ? '1' : '0.05';
    unitSelect.dataset.prevUnit = nu;
    buildGrid();
  });

  let resizeTimer;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(buildGrid, 150); });

  unitSelect.dataset.prevUnit = 'in';
  buildGrid();
})();
</script>
</body>
</html>
